aid: agrapp
name: Agrapp
description: >-
  Agrapp is a Chilean agricultural technology (AgTech) company offering "el
  cuaderno de campo inteligente" (the intelligent field notebook) — a mobile and
  web SaaS platform that helps small and medium farmers record, track, and manage
  their field operations without complex spreadsheets. Founded in 2016 in Santiago
  and backed by 500 Global, Start-Up Chile, OpenBeauchef, and ChileGlobal Ventures,
  the platform provides labor and task tracking with per-task cost analysis,
  inventory and supply (bodega) control, a work calendar, worker attendance and
  performance monitoring, WhatsApp and email alerts, and agricultural plus financial
  reporting to support data-driven decisions. It runs on iOS and Android with an
  offline mode that syncs when connectivity returns. Agrapp does not currently
  publish a public developer API, SDK, or developer documentation; this profile
  captures its public web surface, commercial links, and domain security posture.
